<div class="panel">
    <h2>⚙️ Controllo Processi</h2>
    <div class="controls">
        <button onclick="loadControlloProcessi()">Carica Dati</button>
    </div>
    <div id="processiLoading" class="loading">
        <div class="spinner"></div>
        <p>Caricamento dati...</p>
    </div>
    <div id="processiError" class="error" style="display: none;"></div>
    <div id="processiSuccess" class="success" style="display: none;"></div>
    <div id="processiContent">
        <div class="empty-state">
            <p>Clicca "Carica Dati" per visualizzare il controllo processi</p>
        </div>
    </div>
</div>
