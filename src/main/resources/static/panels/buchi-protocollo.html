<div class="panel">
    <h2>🔍 Buchi di Protocollo</h2>
    <div class="controls">
        <button onclick="loadBuchiProtocollo()">Carica Dati</button>
    </div>
    <div id="buchiLoading" class="loading">
        <div class="spinner"></div>
        <p>Caricamento dati...</p>
    </div>
    <div id="buchiError" class="error" style="display: none;"></div>
    <div id="buchiSuccess" class="success" style="display: none;"></div>
    <div id="buchiContent">
        <div class="empty-state">
            <p>Clicca "Carica Dati" per visualizzare i buchi di protocollo</p>
        </div>
    </div>
</div>
