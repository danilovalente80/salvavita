<div class="panel">
    <h2>🔧 INSERT/UPDATE/DELETE Varie</h2>
    <div class="controls">
        <button onclick="executeVariousOperations()">Esegui Operazioni</button>
        <button onclick="executePsRiservatiOperations()" style="background: #ff9800; margin-left: 10px;">📋 P.S. Riservati (con giorni)</button>
    </div>
    <div id="operationsLoading" class="loading">
        <div class="spinner"></div>
        <p>Esecuzione operazioni in corso...</p>
    </div>
    <div id="operationsError" class="error" style="display: none;"></div>
    <div id="operationsSuccess" class="success" style="display: none;"></div>
    <div id="operationsContent">
        <div class="empty-state">
            <p>Clicca "Esegui Operazioni" per eseguire le query INSERT/UPDATE/DELETE</p>
        </div>
    </div>
    <div id="operationsActions" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #ddd;">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn-commit" onclick="doCommitOperations()" style="background: #4caf50; padding: 12px 30px; font-size: 16px;">✅ COMMIT</button>
            <button class="btn-rollback" onclick="doRollbackOperations()" style="background: #f44336; padding: 12px 30px; font-size: 16px;">❌ ROLLBACK</button>
        </div>
    </div>
</div>
